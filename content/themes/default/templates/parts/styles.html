<style>
/* 墨白 MOBAI — tokens and components.
   Every rule the whole site shares lives here in one part: the engine inlines
   each template into its own response, so a rule written inside single.html
   simply would not exist on the front page. */
:root{
  --bg: oklch(98% 0.004 95);
  --surface: oklch(100% 0.002 95);
  --fg: oklch(20% 0.018 70);
  --muted: oklch(48% 0.012 70);
  --border: oklch(90% 0.006 95);
  --accent: oklch(52% 0.10 28);
  --accent-ink: oklch(99% 0.002 95);
  --font-display: 'Iowan Old Style','Charter',Georgia,'Songti SC','Noto Serif SC',serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --font-mono: 'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg: oklch(22% 0.008 70);
  --surface: oklch(26% 0.009 70);
  --fg: oklch(93% 0.006 95);
  --muted: oklch(72% 0.01 80);
  --border: oklch(34% 0.01 70);
  --accent: oklch(72% 0.11 30);
  --accent-ink: oklch(22% 0.01 40);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1 0 auto}
::selection{background:var(--accent);color:var(--accent-ink)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;z-index:99;background:var(--surface);padding:10px 16px;border:1px solid var(--border)}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}

/* top bar */
.topbar{border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--bg) 88%,transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:50}
.topbar-in{display:flex;align-items:center;gap:28px;height:68px}
.brand{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:17px;border-radius:2px;font-family:var(--font-display)}
.nav{display:flex;gap:22px;font-size:14px;letter-spacing:0.02em;color:var(--muted)}
.nav a{padding:6px 2px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--fg);border-color:var(--accent)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:8px 12px;min-width:210px}
.searchbox input{border:0;outline:0;background:none;color:var(--fg);font-size:14px;width:100%}
.icon-btn{width:38px;height:38px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.lang-nav{display:flex;gap:2px}
.lang-nav a{padding:6px 8px;font-size:12.5px;font-family:var(--font-mono);letter-spacing:.02em;color:var(--muted);border-bottom:2px solid transparent}
.lang-nav a.on{color:var(--fg);border-color:var(--accent)}
.lang-nav a:hover{color:var(--fg)}
.icon-btn:hover{border-color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;padding:11px 20px;font-size:14px;letter-spacing:0.02em;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--fg)}

/* hero */
.kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero{display:grid;grid-template-columns:1.15fr 0.85fr;gap:0;border:1px solid var(--border);background:var(--surface);margin:36px 0 0}
.hero-text{padding:52px 48px}
.hero-text h1{font-family:var(--font-display);font-size:clamp(36px,4.4vw,58px);line-height:1.08;letter-spacing:-0.02em;margin:16px 0 18px}
.hero-text p{color:var(--muted);font-size:17px;max-width:52ch;line-height:1.7}
.hero-meta{display:flex;gap:16px;align-items:center;margin-top:26px;font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:0.02em;flex-wrap:wrap}
.hero-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero-fig{border-left:1px solid var(--border);min-height:100%;position:relative;overflow:hidden;background:#1a1815}
.hero-fig img{width:100%;height:100%;object-fit:cover;min-height:420px}
.hero-fig figcaption{position:absolute;left:16px;bottom:16px;right:16px;background:rgba(15,13,10,0.82);color:#f5f1e8;backdrop-filter:blur(8px);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;flex:none}

/* ticker */
.ticker{display:flex;border:1px solid var(--border);border-top:0;background:var(--surface);font-size:13px;color:var(--muted);overflow-x:auto}
.ticker span{padding:12px 20px;border-right:1px solid var(--border);white-space:nowrap}
.ticker b{color:var(--fg);font-weight:600}

/* section head */
.sec-head{display:flex;align-items:baseline;gap:18px;margin:54px 0 22px}
.sec-head h2{font-family:var(--font-display);font-size:30px;letter-spacing:-0.02em}
.sec-head .line{flex:1;height:1px;background:var(--border)}
.sec-head .more{font-size:13px;letter-spacing:0.02em;color:var(--muted)}
.sec-head.tight{margin-top:36px}

/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--border);background:var(--surface);padding:8px 16px;font-size:13px;letter-spacing:0.02em;cursor:pointer;color:var(--muted)}
.chip.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:hover{border-color:var(--fg);color:var(--fg)}
.chip.active:hover{color:var(--bg)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--border);background:var(--border)}
.card{background:var(--surface);display:flex;flex-direction:column;cursor:pointer;border:0;color:inherit;width:100%}
.card-img{aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--border);background:linear-gradient(135deg,oklch(88% 0.02 70),oklch(80% 0.03 40))}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(0.23,1,0.32,1)}
.card:hover .card-img img{transform:scale(1.04)}
.card-body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.card-cat{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.card-cat em{font-style:normal;color:var(--accent)}
.card h3{font-family:var(--font-display);font-size:22px;line-height:1.3;letter-spacing:-0.01em}
.card:hover h3{color:var(--accent)}
.card p{font-size:14.5px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;background:var(--accent)}
.grid-empty{padding:48px;grid-column:1/-1;text-align:center;color:var(--muted);background:var(--surface)}

/* split feature */
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);background:var(--surface)}
.split-text{padding:48px 44px}
.split-text h2{font-family:var(--font-display);font-size:34px;letter-spacing:-0.02em;line-height:1.2;margin:14px 0}
.split-text p{color:var(--muted);line-height:1.7;max-width:48ch}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 18px;margin:22px 0;font-family:var(--font-display);font-size:19px;line-height:1.55}
.split-list{margin-top:8px;border-top:1px solid var(--border)}
.split-list div{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--border);font-size:14.5px;align-items:baseline}
.split-list .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.split-fig{background:#111;border-left:1px solid var(--border);padding:36px;display:flex;flex-direction:column;gap:18px;justify-content:center;color:#ece7da}
.split-fig img{width:100%;border:1px solid rgba(255,255,255,0.16);aspect-ratio:16/10;object-fit:cover}
.split-fig h3{font-family:var(--font-display);font-size:26px;letter-spacing:-0.01em;line-height:1.25}
.split-fig p{font-size:13px;color:#a89f8d;line-height:1.65}
.split-fig .kicker{color:#c9bfae}

/* rank */
.rank{display:grid;grid-template-columns:1fr 340px;border:1px solid var(--border);background:var(--surface)}
.rank-list a.r{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:20px 26px;border-bottom:1px solid var(--border)}
.rank-list a.r:last-child{border-bottom:0}
.rank-list a.r:hover{background:color-mix(in oklch,var(--bg) 60%,var(--surface))}
.rank-list .num{font-family:var(--font-display);font-size:28px;color:var(--muted)}
.rank-list h4{font-size:16px;font-weight:600}
.rank-list small{color:var(--muted);font-size:13px}
.rank-list .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.side{border-left:1px solid var(--border);padding:28px;background:var(--bg)}
.side h5{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagcloud button{border:1px solid var(--border);background:var(--surface);font-size:13px;padding:6px 12px;cursor:pointer;color:inherit}
.tagcloud button:hover{border-color:var(--fg)}
.newsbox{margin-top:26px;border:1px solid var(--border);background:var(--surface);padding:22px}
.newsbox p{font-size:14px;color:var(--muted);margin:8px 0 14px;line-height:1.65}
.side-lede{font-family:var(--font-display);font-size:20px}
.tagcloud-empty{font-size:13px;color:var(--muted)}
.newsbox .row{display:flex;gap:8px;flex-wrap:wrap}
.newsbox input{flex:1;border:1px solid var(--border);padding:10px 12px;background:var(--bg);color:var(--fg);font-size:14px;outline:0;min-width:0}

/* article (single / page) */
.article{padding:48px 0 0}
.article-head{max-width:760px;margin:0 auto}
.article-head h1{font-family:var(--font-display);font-size:clamp(32px,4vw,46px);line-height:1.18;letter-spacing:-0.02em;margin:14px 0 12px}
.article-byline{color:var(--muted);font-size:14px;font-family:var(--font-mono)}
.article-head .lede{margin-top:14px}
.article-tags{margin-top:26px;font-size:13px;color:var(--muted);font-family:var(--font-mono);letter-spacing:0.02em}
.article-cover{max-width:900px;margin:32px auto 0}
.article-cover img{width:100%;border:1px solid var(--border)}
.article-cover figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
.prose{max-width:760px;margin:0 auto;padding-bottom:8px}
.prose .lede{font-size:19px;color:var(--muted);line-height:1.75;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:28px;font-family:var(--font-display)}
.prose h2{font-family:var(--font-display);font-size:26px;margin:36px 0 12px;letter-spacing:-0.01em}
.prose h3{font-family:var(--font-display);font-size:21px;margin:28px 0 10px}
.prose p{margin:0 0 18px;line-height:1.9;max-width:65ch}
.prose ul,.prose ol{margin:0 0 18px;padding-left:1.4em;line-height:1.9}
.prose li{margin:6px 0}
.prose li::marker{color:var(--accent)}
.prose blockquote{border-left:3px solid var(--accent);padding:6px 0 6px 18px;margin:24px 0;font-family:var(--font-display);font-size:19px;line-height:1.65;color:var(--fg)}
.prose blockquote p:last-child{margin-bottom:0}
.prose hr{border:0;border-top:1px solid var(--border);margin:32px 0}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.prose img{width:100%;border:1px solid var(--border);margin:20px 0 8px}
.prose figure{margin:20px 0}
.prose code{font-family:var(--font-mono);font-size:0.88em;background:color-mix(in oklch,var(--bg) 60%,var(--surface));border:1px solid var(--border);padding:2px 6px}
.prose pre{background:#111;color:#ece7da;padding:20px 22px;overflow-x:auto;margin:0 0 20px;font-family:var(--font-mono);font-size:13.5px;line-height:1.7}
.prose pre code{background:none;border:0;padding:0;color:inherit;font-size:1em}
.prose .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:20px 0}
.prose .gallery img{margin:0}
.prose .wp-button{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:11px 20px;font-weight:600;text-decoration:none;font-family:var(--font-body);font-size:14px}
.prose .wp-columns{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 0}
.article-foot{max-width:760px;margin:36px auto 0;padding-top:22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.notfound{padding:96px 0;text-align:center}
.notfound .code{font-family:var(--font-display);font-size:88px;line-height:1;color:var(--muted)}
.notfound h1{font-family:var(--font-display);font-size:30px;margin:8px 0 0}
.notfound p{color:var(--muted);margin:12px 0 0}
.notfound .btn{margin-top:24px}
.empty{margin:36px 0;padding:48px 24px;text-align:center;color:var(--muted);border:1px dashed var(--border);background:var(--surface)}

/* auth — sign in / register. A single narrow card, no chrome around it: the
   form is the page. */
.auth{padding:72px 24px;display:flex;justify-content:center}
.auth-card{width:100%;max-width:420px;border:1px solid var(--border);background:var(--surface);padding:36px}
.auth-card h1{font-family:var(--font-display);font-size:28px;margin:8px 0 0;line-height:1.2}
.auth-card .lede{color:var(--muted);margin:12px 0 0;font-size:14.5px;line-height:1.7}
.auth-form{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
.field input{border:1px solid var(--border);padding:11px 12px;background:var(--bg);color:var(--fg);font-size:14px;outline:0;font-family:var(--font-body)}
.field input:focus{border-color:var(--accent)}
.auth-form .btn{justify-content:center;margin-top:4px}
.auth-alt{margin:22px 0 0;font-size:14px;color:var(--muted)}
.auth-alt a{color:var(--accent);text-decoration:none}
.auth-alt a:hover{text-decoration:underline}

/* footer */
footer{margin:64px 0 0;border-top:1px solid var(--border);background:var(--surface)}
.foot{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px;padding:48px 0}
.foot h6{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.foot a{display:block;font-size:14px;padding:5px 0;color:var(--muted)}
.foot a:hover{color:var(--fg)}
.foot p{font-size:14px;color:var(--muted);max-width:34ch;line-height:1.7;margin-top:10px}
.copy{border-top:1px solid var(--border);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 20px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:900px){
  .hero,.split,.rank{grid-template-columns:1fr}
  .hero-fig{border-left:0;border-top:1px solid var(--border)}
  .grid{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr 1fr}
  .nav{display:none}
  .hero-text{padding:32px 26px}
  .split-text{padding:32px 26px}
  .split-fig{border-left:0;border-top:1px solid var(--border)}
  .side{border-left:0;border-top:1px solid var(--border)}
  .searchbox{min-width:0;flex:1}
}
@media(max-width:600px){
  .wrap{padding:0 18px}
  .foot{grid-template-columns:1fr}
  .article{padding:28px 0 0}
  .sec-head{margin:36px 0 18px}
  /* Brand + a search box + two buttons do not fit 390px. The subscribe action
     is already in the footer and the sidebar, so it goes; the search box
     shrinks instead of pushing the bar wider than the viewport. */
  .topbar-in{gap:12px}
  .brand{font-size:22px}
  .brand-mark{width:28px;height:28px;font-size:15px}
  .top-actions{flex:1;min-width:0;justify-content:flex-end}
  .searchbox{min-width:0;flex:1;padding:7px 10px}
  .top-actions .btn{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
  .card:hover .card-img img{transform:none}
}
{{! Widgets — platform-rendered sections. One entry per enabled widget; a
    sidebar with no widgets never emits the wrapper, so no dead space. }}
.side-widgets,.foot-widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding-top:26px;padding-bottom:8px}
.foot-widgets{border-top:1px solid var(--border);margin-top:10px}
.widget{font-size:14px}
.widget .widget-title{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono)}
.widget .widget-list{list-style:none;margin:0;padding:0}
.widget .widget-list li{padding:5px 0;border-bottom:1px dashed var(--border)}
.widget .widget-list li:last-child{border-bottom:0}
.widget .widget-list a{color:var(--text);text-decoration:none}
.widget .widget-list a:hover{color:var(--accent,var(--text))}
.widget p{margin:0;color:var(--muted)}
.foot-nav{border-bottom:1px solid var(--border);padding:10px 0;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13.5px}
.foot-nav a{color:var(--muted);text-decoration:none}
.foot-nav a:hover{color:var(--text)}
</style>
