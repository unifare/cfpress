{{@extends "parts/layout"}}
{{@section "content"}}

<p class="eyebrow">{{page.title}}</p>
<h1>Archive</h1>

{{#if posts}}
  <ul class="list">
    {{#each posts as post}}
      <li class="item">
        <h2><a href="{{post.url}}">{{post.title}}</a></h2>
        {{#if post.excerpt}}<p>{{truncate(post.excerpt, 200)}}</p>{{/if}}
      </li>
    {{/each}}
  </ul>
{{else}}
  <p class="empty">No entries in this archive.</p>
{{/if}}

{{/section}}
