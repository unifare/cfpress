<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CFPress Admin</title>
  <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <script>
    // Apply the stored theme before first paint so there is no light/dark flash.
    (function () {
      try {
        var pref = localStorage.getItem("cfpress.admin.theme") || "system";
        var dark = pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { /* storage blocked — fall back to light */ }
    })();
  </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
