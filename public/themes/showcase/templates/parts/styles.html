<style>
:root{
  --bg:      oklch(98% 0.004 95);
  --surface: oklch(100% 0.002 95);
  --fg:      oklch(20% 0.018 70);
  --muted:   oklch(48% 0.012 70);
  --border:  oklch(90% 0.006 95);
  --accent:  oklch(52% 0.10 28);

  --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    'SF Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:oklch(52% 0.10 28 / .18)}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}

/* header */
header{position:sticky;top:0;z-index:50;background:oklch(98% 0.004 95 / .92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.01em;text-decoration:none;color:var(--fg)}
.brand em{font-style:normal;color:var(--accent)}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.01em;transition:color .15s}
.nav-links a:hover{color:var(--fg)}
.lang-toggle{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;background:none;border:1px solid var(--border);padding:6px 12px;cursor:pointer;color:var(--fg);min-height:32px;transition:border-color .15s;text-decoration:none;display:inline-flex;align-items:center}
.lang-toggle:hover{border-color:var(--fg)}
.icon-btn{font-size:12px;background:none;border:1px solid var(--border);padding:6px 9px;cursor:pointer;color:var(--fg);min-height:32px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s}
.icon-btn:hover{border-color:var(--fg)}
/* dark reader: same shapes, inverted paper */
[data-theme="dark"]{
  --bg:      oklch(24% 0.008 70);
  --surface: oklch(28% 0.010 70);
  --fg:      oklch(93% 0.010 95);
  --muted:   oklch(70% 0.012 95);
  --border:  oklch(38% 0.010 95);
  --accent:  oklch(76% 0.090 28);
}
[data-theme="dark"] header{background:oklch(24% 0.008 70 / .92)}
[data-theme="dark"] .feature-media img{filter:brightness(.88)}
.lang-menu{position:relative}
.lang-menu summary{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;border:1px solid var(--border);padding:6px 12px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px;list-style:none}
.lang-menu summary::-webkit-details-marker{display:none}
.lang-menu summary:hover{border-color:var(--fg)}
.lang-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);min-width:140px;z-index:60}
.lang-list a{display:block;padding:8px 14px;font-size:13px;color:var(--muted);text-decoration:none}
.lang-list a:hover{color:var(--fg)}
.lang-list a.on{color:var(--fg);font-weight:600}
@media (max-width:760px){.nav-links a{display:none}}

/* hero */
.hero{padding:clamp(64px,9vw,120px) 0 0}
.kicker{font-family:var(--font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:24px}
.hero h1{font-family:var(--font-display);font-size:clamp(40px,6.2vw,72px);font-weight:600;line-height:1.05;letter-spacing:-.025em;max-width:16em;margin-bottom:28px}
.hero h1 .accent{color:var(--accent)}
.hero-sub{font-size:clamp(17px,1.6vw,19px);color:var(--muted);max-width:38em;line-height:1.65;margin-bottom:40px}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:clamp(48px,6vw,80px)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:.02em;padding:13px 26px;text-decoration:none;min-height:44px;transition:transform .15s cubic-bezier(.23,1,.32,1),background .15s,color .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--fg);color:var(--bg)}
.btn-primary:hover{background:var(--accent)}
.btn-ghost{border:1px solid var(--border);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg)}
.hero-figure{border-top:1px solid var(--border);padding-top:12px}
.hero-figure img{width:100%;display:block}
.fig-cap{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.01em;padding-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:clamp(64px,8vw,104px) 0}
.stat{padding:32px 24px 32px 0;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat b{display:block;font-family:var(--font-display);font-size:clamp(30px,3vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.stat span{font-size:13px;color:var(--muted);letter-spacing:.01em}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:24px 16px 24px 0}.stat:nth-child(2){border-right:none}.stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--border)}}

/* sections */
section{padding:clamp(56px,7vw,96px) 0}
.sec-head{margin-bottom:clamp(36px,4vw,56px);max-width:44em}
.sec-head h2{font-family:var(--font-display);font-size:clamp(30px,3.4vw,44px);font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:16px 0}
.sec-head p{color:var(--muted);font-size:17px;max-width:36em}

/* features */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,72px);align-items:center;padding:clamp(40px,5vw,64px) 0;border-top:1px solid var(--border)}
.feature:last-of-type{border-bottom:1px solid var(--border)}
.feature:nth-child(even) .feature-media{order:-1}
@media (max-width:860px){.feature{grid-template-columns:1fr}.feature:nth-child(even) .feature-media{order:0}}
.feature-text h3{font-family:var(--font-display);font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.01em;margin:14px 0;line-height:1.2}
.feature-text p{color:var(--muted);font-size:16px;max-width:34em}
.feature-text p+p{margin-top:16px}
.feature-media{border:1px solid var(--border);background:var(--surface)}
.feature-media img{width:100%;display:block}

/* box */
.box-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border)}
.box-cell{padding:28px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
.box-cell h4{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
.box-cell p{font-size:15px;color:var(--muted);line-height:1.55}
@media (max-width:860px){.box-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.box-grid{grid-template-columns:1fr}}

/* compare */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:16px 20px;text-align:left;font-size:14.5px;border-bottom:1px solid var(--border);vertical-align:top}
thead th{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:2px solid var(--fg);white-space:nowrap}
tbody th{font-weight:500;color:var(--muted);white-space:nowrap}
td.cfp{font-weight:600}
.table-note{margin-top:20px;font-size:13.5px;color:var(--muted);max-width:40em}

/* quickstart */
.quickstart{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.qs-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(32px,5vw,72px);align-items:center}
@media (max-width:860px){.qs-grid{grid-template-columns:1fr}}
pre{font-family:var(--font-mono);font-size:13.5px;line-height:1.7;background:var(--bg);border:1px solid var(--border);padding:24px;overflow-x:auto;color:var(--fg)}
pre .c{color:var(--muted)}

/* license */
.license-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border)}
.license-cell{background:var(--surface);padding:32px}
.license-cell h4{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:10px}
.license-cell p{font-size:15px;color:var(--muted)}
@media (max-width:760px){.license-grid{grid-template-columns:1fr}}

/* cta */
.cta-band{text-align:center;padding:clamp(72px,9vw,120px) 0}
.cta-band h2{font-family:var(--font-display);font-size:clamp(32px,4vw,52px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:20px;max-width:14em;margin-left:auto;margin-right:auto}
.cta-band p{color:var(--muted);font-size:17px;max-width:32em;margin:0 auto 40px}

/* footer */
footer{border-top:1px solid var(--border);padding:40px 0 48px}
.foot{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.foot small{font-size:13px;color:var(--muted);max-width:34em;line-height:1.6;display:block}
.foot-links{display:flex;gap:24px}
.foot-links a{font-size:13px;color:var(--muted);text-decoration:none}
.foot-links a:hover{color:var(--fg)}
</style>
